name: macOS OpenGL 4.1 startup and render smoke

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/macos-gl41-smoke.yml'
      - 'CMakeLists.txt'
      - 'rts/**'
      - 'installer/Mac/BAR-GL41-Info.plist'
      - 'installer/Mac/bar-gl41-launcher.sh'
      - 'doc/macos-gl41-*.md'
      - 'macos-build-bar.sh'
  push:
    branches:
      - 'agent/macos-gl41-*'
    paths:
      - '.github/workflows/macos-gl41-smoke.yml'
      - 'CMakeLists.txt'
      - 'rts/**'
      - 'installer/Mac/BAR-GL41-Info.plist'
      - 'installer/Mac/bar-gl41-launcher.sh'
      - 'doc/macos-gl41-*.md'
      - 'macos-build-bar.sh'

permissions:
  contents: read
  statuses: write

concurrency:
  group: macos-gl41-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup-render-smoke:
    name: Apple Silicon macOS 15 / OpenGL 4.1 Core
    runs-on: macos-15
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_PREFIX: /opt/homebrew
      CCACHE_DIR: ${{ github.workspace }}/build/.ccache
      CCACHE_MAXSIZE: 750M
      CCACHE_COMPRESS: '1'

    steps:
      - name: Publish pending smoke status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state: 'pending',
              context: 'macOS OpenGL 4.1 startup/render smoke',
              description: 'Native Apple Silicon build and render smoke is running',
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

      - name: Checkout source and submodules
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout paired BAR content and configuration
        uses: actions/checkout@v4
        with:
          repository: BTobben/Beyond-All-Reason
          ref: agent/macos-gl41-ubo-content
          path: bar-content
          fetch-depth: 1
          lfs: false
          sparse-checkout: |
            common
            modinfo.lua

      - name: Validate one-command bootstrap syntax
        run: |
          bash -n macos-build-bar.sh
          bash -n installer/Mac/bar-gl41-launcher.sh

      - name: Fetch upstream engine version tags
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = 'true' ]; then
            git fetch --no-recurse-submodules --unshallow --force --tags https://github.com/beyond-all-reason/RecoilEngine.git master
          else
            git fetch --no-recurse-submodules --force --tags https://github.com/beyond-all-reason/RecoilEngine.git master
          fi
          git describe --tags --match '[0-9]*' --long

      - name: Restore compiler cache
        uses: actions/cache/restore@v5
        with:
          path: build/.ccache
          key: macos-gl41-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            macos-gl41-ccache-v1-${{ runner.os }}-${{ runner.arch }}-

      - name: Install native build dependencies
        run: >-
          brew install
          ccache
          cmake
          ninja
          pkgconf
          sdl2-compat
          devil
          fontconfig
          freetype
          expat
          xz
          sevenzip
          openal-soft
          libogg
          libvorbis

      - name: Configure graphical engine
        env:
          CMAKE_PREFIX_PATH: /opt/homebrew;/opt/homebrew/opt/expat;/opt/homebrew/opt/openal-soft;/opt/homebrew/opt/libogg;/opt/homebrew/opt/libvorbis
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/opt/homebrew/opt/expat/lib/pkgconfig:/opt/homebrew/opt/libogg/lib/pkgconfig:/opt/homebrew/opt/libvorbis/lib/pkgconfig
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RELEASE \
            -DCMAKE_INSTALL_PREFIX="${{ github.workspace }}/build/Beyond All Reason GL41.app/Contents/Resources/runtime" \
            -DCMAKE_PREFIX_PATH="$CMAKE_PREFIX_PATH" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DMACOSX_BUNDLE=OFF \
            -DINSTALL_PORTABLE=ON \
            -DPREFER_STATIC_LIBS=OFF \
            -DNO_SOUND=OFF \
            -DENABLE_STREFLOP=ON \
            -DAI_TYPES=NONE \
            -DBUILD_spring-dedicated=OFF \
            -DBUILD_spring-headless=OFF

      - name: Build and install graphical engine without CI version bypass
        run: env -u CI cmake --build build --target install-spring-legacy --parallel 3

      - name: Assemble and sign the development app
        run: |
          app='build/Beyond All Reason GL41.app'
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/BAR-content"
          cp installer/Mac/bar-gl41-launcher.sh "$app/Contents/MacOS/Beyond All Reason GL41"
          chmod +x "$app/Contents/MacOS/Beyond All Reason GL41"
          cp installer/Mac/BAR-GL41-Info.plist "$app/Contents/Info.plist"
          ditto bar-content "$app/Contents/Resources/BAR-content"
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"

      - name: Create isolated smoke configuration
        run: |
          mkdir -p build/smoke-write
          cp bar-content/common/configs/macos-gl41.cfg build/gl41-smoke.cfg
          printf '%s\n' \
            'XResolutionWindowed=128' \
            'YResolutionWindowed=128' \
            'WindowPosX=32' \
            'WindowPosY=32' \
            >> build/gl41-smoke.cfg
          git -C bar-content rev-parse HEAD | tee build/bar-content.sha

      - name: Run real engine startup and render smoke
        env:
          BAR_WRITE_DIR: '${{ github.workspace }}/build/smoke-write'
          BAR_CONFIG: '${{ github.workspace }}/build/gl41-smoke.cfg'
        run: |
          set -o pipefail
          './build/Beyond All Reason GL41.app/Contents/MacOS/Beyond All Reason GL41' \
            --gl-smoke-test \
            --window \
            --isolation \
            --isolation-dir="${{ github.workspace }}/build/Beyond All Reason GL41.app/Contents/Resources/runtime" \
            2>&1 | tee build/gl41-smoke.stdout.log
          grep -F '[GLSmoke] PASS context=4.1 Core' build/smoke-write/infolog.txt

      - name: Collect diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-gl41-smoke-diagnostics
          if-no-files-found: warn
          path: |
            build/gl41-smoke.cfg
            build/gl41-smoke.stdout.log
            build/bar-content.sha
            build/smoke-write/infolog.txt
            bar-content/common/configs/macos-gl41.cfg
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml

      - name: Report compiler cache statistics
        if: always()
        run: |
          if command -v ccache >/dev/null; then
            ccache --show-stats
          fi

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: build/.ccache
          key: macos-gl41-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}

      - name: Publish final smoke status
        if: always()
        uses: actions/github-script@v7
        env:
          SMOKE_JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const state = process.env.SMOKE_JOB_STATUS === 'success'
              ? 'success'
              : process.env.SMOKE_JOB_STATUS === 'cancelled' ? 'error' : 'failure';
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              state,
              context: 'macOS OpenGL 4.1 startup/render smoke',
              description: `Native smoke ${process.env.SMOKE_JOB_STATUS}`,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
